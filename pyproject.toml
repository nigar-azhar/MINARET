[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minaret"
version = "1.0.0"
description = "MINARET: transcription, correction, corpus-grounded entity validation, KG and RAG for Islamic lecture audio"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6", "python-dotenv>=1.0", "httpx>=0.27", "numpy>=1.26", "rapidfuzz>=3.9"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]                 # V0 transcription
kg = ["rdflib>=7.0"]                          # knowledge-graph build + RQ4
rag = ["sentence-transformers>=3.0"]          # bge-m3 embeddings, bge-reranker-v2-m3
eval = ["rdflib>=7.0"]
all = ["faster-whisper>=1.0", "rdflib>=7.0", "sentence-transformers>=3.0"]
test = ["pytest>=8"]

[project.scripts]
minaret = "minaret.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["minaret"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
